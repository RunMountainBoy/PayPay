name: PayPay
options:
  bundleIdPrefix: com.paypay
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: bottom
  generateEmptyDirectories: true
  developmentLanguage: en
  minimumXcodeGenVersion: "2.0.0"

targets:
  PayPay:
    type: application
    platform: iOS
    sources:
      - Sources/Domain
      - Sources/Application
      - Sources/Infrastructure
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.paypay.app
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
      ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
      INFOPLIST_KEY_CFBundleDisplayName: PayPay
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(SWIFT_ACTIVE_COMPILATION_CONDITIONS_$(PLATFORM_NAME))"
    info:
      path: Sources/Infrastructure/App/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: 1.0
        CFBundleVersion: 1
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  PayPayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: PayPay
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.paypay.PayPayTests
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(SWIFT_ACTIVE_COMPILATION_CONDITIONS_$(PLATFORM_NAME))"

schemes:
  PayPay:
    build:
      targets:
        PayPay: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PayPayTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
